# ═══════════════════════════════════════════════════════════════════════════════
# Per-stage Executor Prompts (5 keys)
# Rendered as "## Stage Executor Scheduling" section via {{stage_executor}} placeholder.
# Placeholders within these values: {subagent_type}, {context_arg}
# {subagent_type} is filled from the stage→agent mapping.
# {context_arg} is a hint for the main thread to fill the document path.
# stage_executor_clarify is optional (not in CRITICAL_PLACEHOLDERS).
# Trigger: stage entry system-prompt rendering via {{stage_executor}} placeholder
# ═══════════════════════════════════════════════════════════════════════════════

stage_executor_clarify: |
  ## Stage Executor Scheduling
  This stage is executed by the user-invoked agent: `{subagent_type}`
  **Scheduling**: User @`{subagent_type}` in chat with the requirement document path.
  **Return protocol**: On `full-und?` confirmation, write the `## 模型确认` marker to the requirement document and STOP. Do NOT call `stage_advance` — the `agent_settled` hook auto-verifies (completionMarker) and advances to `plan`. **MUST**: end every round's user-facing output with two complete, copy-pasteable command lines containing the full document path and the real agent name — `@<agent> <doc> <round+1> 答` and `@<agent> <doc> full-und?`. Never emit a `{file}` placeholder literal in a user-facing prompt.
  **Triage**: If the user asks an unrelated question (not @mention with doc path or round args), answer briefly and do NOT touch pipeline state. Only pipeline-turn messages (containing verification results, stage routing, or @agent doc args) trigger verification.
  **Re-launch**: When the user mentions `@{subagent_type} {file} {args}` during clarify, spawn a **new task** with `description = Clarify: {file} {args}` — do NOT resume the previous task. Each round gets its own task title reflecting the round number. **MUST**: prompt and description must carry the user's current-round args verbatim (e.g. `2 答`); do NOT reuse the previous round's title or args.
  **Parent wait discipline**: After relaying the clarification questions to the user, STOP and WAIT. Do NOT collect answers interactively (e.g. via `ask_user_question`). The sole answer channel is the `**答**` fields of the requirement document. The user drives the next round by re-mentioning the agent with the document path.
  {active_spawn_note}

# ─── Design-review strict prompt keys (192 / 193) ────────────────────────────
# `design_review_update_prompt` (192) and `design_review_smart_decision_prompt`
# (193) are read STRICTLY: ONLY a missing file or missing key falls back to
# the plugin's built-in default; an explicit empty/non-string value or a
# broken YAML BLOCKS the corresponding dispatch (never a silent default swap).
# Tokens: update → {pipelineId} {planDoc} {reviewDoc} {round} {operationId}
# {baselinePlanHash} {issues} {requirementDoc}; smart decision → {pipelineId}
# {planDoc} {round} {operationId} {inputHash} {reportDoc}. Any other brace
# identifier in the text blocks the dispatch. Example fields: no braces.
design_review_update_prompt: |
   ## Design Review Update Mode
   This plan update is triggered by a **design-review FAIL** verdict. You are in authorized update mode.

   **MUST**: Process each issue from the design review report in the `## Design Review Update` section below:
   - Read the report at {reviewDoc} fully first; ONLY modify the existing plan document ({planDoc})
   - For each issue, provide a disposition: `fixed`, `deferred`, or `rejected` with justification
   - Use `new-decision` as the disposition when a NEW requirement/decision is needed that you cannot make alone, and `unfixable` with proof when an issue cannot be fixed in this plan; either one stops the automatic loop for owner review
   - Do NOT claim "fixed" without actual changes to the plan document
   - Do NOT add new clarification rounds or fabricate user confirmation
   - Do NOT modify source code or the requirement document

   **Output Format** (section header and the four association fields are exact):
   ```markdown
   ## Design Review Update

   **Report**: {reviewDoc}
   **Round**: {round}
   **Operation**: {operationId}
   **Baseline Hash**: {baselinePlanHash}

   ### Issue Dispositions

   | # | Issue | Disposition | Justification |
   |---|-------|-------------|---------------|
   | 1 | short summary of the issue from the report | fixed / deferred / rejected / new-decision / unfixable | one-line rationale |
   ...

   ### Changes Made

   - where in the plan each fixed issue was addressed (for the next review round)
   ```

   **Constraints**:
   - Only modify the plan document ({planDoc})
   - Do NOT modify source code, requirement docs, or add clarification rounds
   - Preserve all existing plan structure and decisions unless explicitly addressing review issues
   - The disposition table must cover EVERY issue of the consumed report exactly once (by the report's issue numbering); missing or duplicate entries invalidate the update
   - The updated plan will be automatically re-reviewed in the next design-review round; fix quality is judged there, not by this step

# 193 Phase 4 (task 1): shipped as an explicit entry so businesses can
# customise the smart decision protocol. The text below is KEPT IN SYNC with
# DEFAULT_DESIGN_REVIEW_SMART_DECISION_PROMPT (asserted by the asset test).
# Strict-read semantics: only a missing FILE/KEY falls back to the built-in
# default; an explicit empty/non-string value or broken YAML BLOCKS the
# smart review dispatch. Only declared tokens may appear in braces; the
# fenced example fields carry NO braces so they are never token-substituted.
design_review_smart_decision_prompt: |
   ## Design Review Smart Plan-Revision Decision

   This review runs under SMART confirmation mode for pipeline {pipelineId}.
   Identity: plan {planDoc}, round {round}, review operation {operationId},
   input hash {inputHash}, report {reportDoc}.

   - If your verdict is PASS: ignore this section entirely and never write a
     Plan Revision Decision into a PASS report.
   - If your verdict is FAIL: append EXACTLY ONE section to the report:

   ```markdown
   ## Plan Revision Decision

   **action**: revise-plan
   **reason**: <replace this line with one real justification>
   ```

   - **action** accepts ONLY these two lowercase tokens:
     - revise-plan — every issue is fixable inside the plan document by an
       authorized autonomous revision pass.
     - request-human — at least one issue needs a human call (requirement
       conflict, product direction, missing authority, or information only the
       owner can supply).
   - proceed-develop is NOT a valid action: a FAIL verdict can never ask to
     enter development; smart mode does not release FAIL automatically.
   - **reason** must be a real justification line — never blank, never left as the
     angle-bracket instruction or any other copied template placeholder.
   - A FAIL report without this exact section (or with a duplicated,
     contradictory, empty or placeholder variant) is rejected as INVALID and
     returned to you for correction — it is never routed anywhere.

stage_executor_plan: |
  ## Stage Executor Scheduling
  This stage uses `{subagent_type}` (lightweight advance mode).
  **Scheduling**: User @`{subagent_type}` in chat; main thread receives `nextStage: develop` and calls stage_advance.
  **Context**: {context_arg}
  **Checkpoint**: Do NOT call `stage_advance` until the plan document is complete and user-confirmed. This checkpoint applies to ORDINARY plan mode ONLY: in authorized design-review update mode (the `design_review_update_prompt` section governs), do NOT wait for or fabricate user confirmation — the plugin re-reviews the updated plan automatically.
  {active_spawn_note}

stage_executor_design-review: |
  ## Stage Executor Scheduling
  This stage is executed by sub-agent: `{subagent_type}`
  **Scheduling**: The plugin auto-spawns `{subagent_type}` on stage entry. Main thread must NOT re-invoke. Only when no Active-spawn prompt appears (RPC unavailable fallback), the main thread may call `{subagent_type}` via task tool.
  **Return protocol**: The reviewer ONLY writes/updates the current design-review report file and stops. It never approves stages, never calls `stage_advance`, and never routes its own verdict — the plugin validates the report (identity + completeness) and owns every transition.
  **Context**: {context_arg}
  **Verdict routing (plugin-enforced, 193)**: a trusted, contract-complete PASS proceeds to develop in EVERY confirmation mode. A valid FAIL is handled by the configured mode: auto = an authorized plan-revision pass then re-review; manual = the human decision menu (Revise Plan / Proceed to Develop / Cancel); smart = the reviewer's binary declaration (`revise-plan` / `request-human`) — smart NEVER releases a FAIL automatically. Any valid `## Issues` entry forces FAIL regardless of the conclusion line; entry authorization never pre-approves a future FAIL.
  {active_spawn_note}

stage_executor_develop: |
  ## Stage Executor Scheduling
  This stage is executed by sub-agent: `{subagent_type}`
  **Scheduling**: The plugin auto-spawns `{subagent_type}` on stage entry. Main thread must NOT re-invoke. Only when no Active-spawn prompt appears (RPC unavailable fallback), the main thread may call `{subagent_type}` via task tool.
  **Return protocol**: Sub-agent returns `nextStage: <stage>` suggestion; main thread calls stage_advance.
  **Context**: {context_arg}
  **Checkpoint**: Build + tests must pass before `stage_advance` with `nextStage: review`.
  {active_spawn_note}

stage_executor_review: |
  ## Stage Executor Scheduling
  This stage is executed by sub-agent: `{subagent_type}`
  **Scheduling**: The plugin auto-spawns `{subagent_type}` on stage entry. Main thread must NOT re-invoke. Only when no Active-spawn prompt appears (RPC unavailable fallback), the main thread may call `{subagent_type}` via task tool.
  **Return protocol**: Sub-agent returns `nextStage: <stage>` suggestion; main thread calls stage_advance.
  **Context**: {context_arg}
  **Checkpoint**: Review report must contain a verdict line before `stage_advance`.
  {active_spawn_note}

stage_executor_fix: |
  ## Stage Executor Scheduling
  This stage is executed by sub-agent: `{subagent_type}`
  **Scheduling**: The plugin auto-spawns `{subagent_type}` on stage entry. Main thread must NOT re-invoke. Only when no Active-spawn prompt appears (RPC unavailable fallback), the main thread may call `{subagent_type}` via task tool.
  **Return protocol**: Sub-agent returns `nextStage: <stage>` suggestion; main thread calls stage_advance.
  **Context**: {context_arg}
  **Checkpoint**: Build + tests must pass before `stage_advance` with `nextStage: review`.
  {active_spawn_note}

# ═══════════════════════════════════════════════════════════════════════════════
# Per-stage Plugin Default Deliverables (5 keys) — Phase 0 (146)
# Read by verify-generator as plugin default delivery items (verify rule layer).
# Also injected via {{stage_deliverables}} placeholder into system prompt (inform agent).
# clarify/plan have mechanism-coupled deliverables (model confirmation, planning docs).
# develop/review/fix have code artifact deliverables (build, test, commit, review report).
# Items use **MUST** markers so extractHardcodedItems can parse them.
# Trigger: /pipeline-init 1 verify generation (loadPluginDeliverables); {{stage_deliverables}} system-prompt injection
# ═══════════════════════════════════════════════════════════════════════════════

stage_deliverable_clarify: |
  - **MUST** produce clarification questions and record answers
  - **MUST** write `## 模型确认` / `## Model Confirmation` marker to the requirement document via write or edit tools upon full-und? confirmation
  - **MUST** use round heading format `# 第 N 轮澄清` (recommended) or `# Round N` (compatible) — `#{1,2}` only (h1/h2) to prevent h3+ false positives
  - **MUST** include answer fields in bilingual form: `答：`/`答:`/`**答**`/`Answer:` (all accepted)
  - **MUST** end every round (including the final/summary round) by outputting two complete, copy-pasteable next-step command lines containing the full document path and the real agent name: `@<agent> <doc> <round+1> 答` and `@<agent> <doc> full-und?` — never emit a `{file}` placeholder literal
  - **MUST** write every round (including decision-archive/summary rounds) in full Q/A structure: question + options A/B + pros/cons/recommendation + `答：` — no exemption for summary rounds

stage_deliverable_plan: |
  - **MUST** produce a planning document with implementation steps
  - **MUST** include phase breakdown and task descriptions
  - **MUST** end the plan document with `## 用户确认` / `## User Confirmation` section for user sign-off

stage_deliverable_design-review: |
  - **MUST** perform design review and produce a review report containing ALL four sections exactly once (any order): `## Summary`, `## Recommendations`, `## Verdict`, `## Issues`
  - **MUST** include the five identity header rows binding the report to this review — `**pipeline**: {pipelineId}`, plan path, round, operation, input hash — copied verbatim from the spawn context, never from memory
  - **MUST** write exactly `None` as the only `## Issues` entry when there are no issues (an empty Issues section is never "no issues")
  - **MUST** include a verdict line in bilingual+bold-tolerant form: `结论：(通过|不通过)` / `Verdict: (PASS|FAIL)` / `**Design Review: (PASS|FAIL)**` — bold/italic markup (`**`/`_`) tolerated
  - **MUST** provide clear reasoning for the verdict (PASS or FAIL) and actionable recommendations
  - **MUST NOT** conclude PASS while any valid `## Issues` entry exists — issues take precedence; any real issue forces FAIL regardless of severity labels
  - **MUST NOT** self-approve or drive stage transitions — the plugin validates the report and routes PASS/FAIL by the configured confirmation mode
  - In SMART confirmation mode a FAIL verdict **MUST** additionally carry exactly one `## Plan Revision Decision` section with `**action**: revise-plan` or `**action**: request-human` and a non-placeholder `**reason**` line; PASS reports never include it and `proceed-develop` is never a valid action

stage_deliverable_develop: |
  - **MUST** run the project build command and confirm it passes (command determined by project tech stack)
  - **MUST** run the project unit test command and confirm it passes (command determined by project tech stack)
  - **MUST** commit changes
  - **MUST** include `**pipeline**: {pipelineId}` in the artifact file header
  - **MUST NOT** directly write to `.pi/audit/`; use `generate_stage_summary(commitIds: [...])` tool to record commit IDs in the stage summary
  - **MUST** write a human-readable commit record to `docs/design/` (e.g. `{plan_stem}_plan_commit.md`)

stage_deliverable_review: |
  - **MUST** include `**pipeline**: {pipelineId}` in the artifact file header
  - **MUST** perform code review and produce a review report
  - **MUST** include a verdict line in bilingual+bold-tolerant form: `结论：(通过|不通过)` / `Verdict: (PASS|FAIL)` / `Conclusion: (pass|fail)` — bold/italic markup (`**`/`_`) tolerated

stage_deliverable_fix: |
  - **MUST** run the project build command and confirm it passes (command determined by project tech stack)
  - **MUST** run the project unit test command and confirm it passes (command determined by project tech stack)
  - **MUST** include `**pipeline**: {pipelineId}` in the artifact file header
  - **MUST** fix the identified issues from the review report
  - **MUST NOT** directly write to `.pi/audit/`; use `generate_stage_summary(commitIds: [...])` tool to record commit IDs in the stage summary
  - **MUST** write a human-readable commit record to `docs/design/` (e.g. `{plan_stem}_plan_commit.md`)

