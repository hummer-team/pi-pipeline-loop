# Pipeline Stage Prompt Configuration
# ==========================================
#
# This file configures per-stage agent prompts and verification prompts
# for the pi-pipeline plugin. It is read from `.pi/references/pipeline-stage-prompt.yml`.
#
# Key Structure:
#   Stage prompt keys (5):
#     clarify, plan, develop, review, fix
#     — Rendered as the agent's system prompt for each stage.
#
#   Per-stage verify execution prompts (5):
#     verify_clarify, verify_plan, verify_develop, verify_review, verify_fix
#     — Used as modelPrompt during stage verification (execution phase).
#     — Empty/missing → falls back to DEFAULT_VERIFY_PROMPT.
#
#   Per-stage verify extract prompts (5):
#     verify_extract_clarify, verify_extract_plan, verify_extract_develop,
#     verify_extract_review, verify_extract_fix
#     — Used for LLM-based delivery item extraction (generation phase).
#     — Fallback chain: verify_extract_{stage} → verify_extract → DEFAULT_VERIFY_EXTRACT_PROMPT.
#
#   Per-stage executor prompts (5) — Phase 4 (139) + Phase 0 (146):
#     stage_executor_clarify, stage_executor_plan, stage_executor_develop,
#     stage_executor_review, stage_executor_fix
#     — Rendered as "## Stage Executor Scheduling" section describing which sub-agent
#       executes the stage and how the main thread orchestrates the handoff.
#     — Injected via {{stage_executor}} placeholder (clarify: optional, not in CRITICAL_PLACEHOLDERS).
#
#   Per-stage plugin default deliverables (3) — Phase 0 (146):
#     stage_deliverable_develop, stage_deliverable_review, stage_deliverable_fix
#     — Read by verify-generator as plugin default delivery items (verify rule layer).
#     — Also injected via {{stage_deliverables}} placeholder into system prompt (inform agent).
#     — clarify/plan have no plugin default deliverables (no code artifacts/commit/build).
#
#   Global verify extract fallback (1):
#     verify_extract
#     — Fallback when per-stage verify_extract_{stage} is empty/missing.
#
#   Conflict check prompt (1) — Phase 6 (146):
#     conflict_check_prompt
#     — System prompt for model-based SKILL/plugin conflict detection during /pipeline-init.
#     — Fallback chain: conflict_check_prompt_{stage} → conflict_check_prompt → DEFAULT_CONFLICT_CHECK_PROMPT.
#     — Not a stage template placeholder; read directly by runConflictCheck.
#
# Total: 25 keys (5 stage + 5 verify_{stage} + 5 verify_extract_{stage} + 5 stage_executor_{stage} + 3 stage_deliverable_{stage} + 1 verify_extract + 1 conflict_check_prompt)
#
# Placeholder Protocol:
#   Placeholders use the format {{key}} and are replaced at runtime with
#   dynamic values built from pipeline state.
#
# Available placeholders (10 total):
#   {{context_reference}}    — Part 1: previous summary + context files + requirement doc path
#   {{domain_skill}}         — Part 2: business domain rules
#   {{stage_skill}}          — Part 3: current stage skill content (.pi/skills/{skillPath})
#   {{loop_status}}          — Part 4: loop engineering status (develop/fix only)
#   {{pipeline_status}}      — Part 5: pipeline ID, stage, domain, validation
#   {{verify_failures}}      — Part 6: previous verification failures
#   {{verify_tool_guidance}} — Part 7: verification tool mode guidance
#   {{stage_write_scope}}    — Part 8: write scope for non-loop stages
#   {{stage_executor}}       — Part 9: stage executor scheduling (all 5 stages; clarify optional)
#   {{stage_deliverables}}   — Part 10: plugin default deliverables (develop/review/fix; optional)
#
# Paragraph Format:
#   Each placeholder occupies its own paragraph. Paragraphs separated by
#   a line containing only `---`. When a placeholder's dynamic value is null
#   or empty, the entire paragraph (between --- separators) is removed from
#   the rendered output.
#
# Unknown Placeholders:
#   Any {{xxx}} not in the 10 known keys above is preserved as-is (not replaced).
#
# Critical Placeholder Missing:
#   If a critical placeholder is absent from the template, the entire stage
#   falls back to the default prompt. Critical placeholders by stage:
#   - All stages: {{pipeline_status}}
#   - develop/fix: + {{loop_status}}
#   - clarify/plan/review: + {{stage_write_scope}}
#   - plan/develop/review/fix: + {{stage_executor}}
#   Note: {{stage_deliverables}} and clarify's {{stage_executor}} are NOT critical
#   (existing yml templates without them should not trigger fallback).
#
# Empty Value Fallback:
#   If a stage key's value is empty or whitespace-only, the default prompt
#   is used (same as if the key were missing entirely).

# ═══════════════════════════════════════════════════════════════════════════════
